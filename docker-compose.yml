version: '3'

services:
  nginx:
    image: nginx:alpine
    container_name: task_api_nginx
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - task_api_network

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: task_api_php
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
    networks:
      - task_api_network

  mysql:
    image: mysql:8.0
    container_name: task_api_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: task_api
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: task_user
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task_api_network

networks:
  task_api_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local